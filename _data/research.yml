- id: maintenance
  title: Predictive maintenance
  short: Fault diagnosis with little labeled data, on affordable edge hardware.
  summary: Downtime costs money and labelled fault data rarely exists. We engineer self-supervised, federated and continual learning approaches to machine condition monitoring, as well as low-cost edge hardware to enable affordable monitoring for small and medium manufacturers.
  media: motor-rig
  funding: NSF PFI-TT 2535434, NSF CMMI-2015889
  projects:
  - title: Context-aware self-supervised learning
    text: Operating-condition metadata used as a weak training signal for fault diagnosis without fault labels.
    papers:
    - title: 'Context-Aware Self-Supervised Learning for Machinery Fault Diagnosis: Extending Barlow Twins with Operating Condition Awareness'
      venue: Manufacturing Letters 2026
      url: https://doi.org/10.1016/j.mfglet.2026.08.027
  - title: Federated and cross-machine monitoring
    text: Personalized federated learning and cross-robot open-set fault detection that adapt from normal data only.
    papers:
    - title: A generalizable framework of personalized federated learning for condition monitoring of rotating machinery
      venue: Advanced Engineering Informatics 2026
      url: https://doi.org/10.1016/j.aei.2026.105302
    - title: Cross-robot open-set fault detection via normal-only adaptation and residual latent-space alignment
      venue: Robotics and Computer-Integrated Manufacturing 2026
      url: https://doi.org/10.1016/j.rcim.2026.103442
    - title: Maximizing model generalization for machine condition monitoring with Self-Supervised Learning and Federated Learning
      venue: Journal of Manufacturing Systems 2023
      url: https://doi.org/10.1016/j.jmsy.2023.09.008
  - title: Edge-cloud monitoring
    text: A deployable edge computing pipeline for condition monitoring on the shop floor.
    papers:
    - title: A Deployable Edge Computing Solution for Machine Condition Monitoring
      venue: I2MTC 2024
      url: https://doi.org/10.1109/i2mtc60896.2024.10560795
