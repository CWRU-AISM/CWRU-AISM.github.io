- id: maintenance
  title: Predictive Maintenance
  short: Adaptive, data-efficient machine condition monitoring through self-supervised learning and affordable edge–cloud systems.
  summary: Industrial predictive maintenance faces persistent challenges arising from limited labeled fault data, changing operating conditions, and heterogeneous machinery. We develop self-supervised, continual, and personalized federated learning methods that extract transferable health representations from predominantly unlabeled operational data, enabling robust fault detection and diagnosis across machines and working environments. These methods are integrated with low-cost sensing hardware and edge–cloud computing architectures to make intelligent condition monitoring practical, scalable, and affordable for industrial deployment.
  media: motor-rig
  funding: NSF PFI-TT 2535434, NSF CMMI-2529773
  projects:
  - title: Context-Aware Self-Supervised Continual Learning
    text: Leverage operating-condition information to learn transferable machinery health representations with minimal labeled fault data.
    papers:
    - title: 'Mixed-Up Experience Replay for Adaptive Online Condition Monitoring'
      venue: IEEE Trans. Industrial Electronics 2023
      url: https://doi.org/10.1109/TIE.2023.3260351
    - title: 'Context-Aware Self-Supervised Learning for Machinery Fault Diagnosis: Extending Barlow Twins with Operating Condition Awareness'
      venue: Manufacturing Letters 2026
      url: https://doi.org/10.1016/j.mfglet.2026.08.027
  - title: Federated and Cross-Machine Condition Monitoring
    text: Combine personalized federated learning and domain adaptation for reliable condition monitoring across machines and operating conditions.
    papers:
    - title: A generalizable framework of personalized federated learning for condition monitoring of rotating machinery
      venue: Advanced Engineering Informatics 2026
      url: https://doi.org/10.1016/j.aei.2026.105302
    - title: Cross-robot open-set fault detection via normal-only adaptation and residual latent-space alignment
      venue: Robotics and Computer-Integrated Manufacturing 2026
      url: https://doi.org/10.1016/j.rcim.2026.103442
    - title: Maximizing model generalization for machine condition monitoring with Self-Supervised Learning and Federated Learning
      venue: Journal of Manufacturing Systems 2023
      url: https://doi.org/10.1016/j.jmsy.2023.09.008
  - title: Edge–Cloud Predictive Maintenance
    text: Integrate lightweight learning models with affordable sensing devices and edge–cloud systems for continuous industrial condition monitoring.
    papers:
    - title: A Deployable Edge Computing Solution for Machine Condition Monitoring
      venue: I2MTC 2024
      url: https://doi.org/10.1109/i2mtc60896.2024.10560795
