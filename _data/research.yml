- id: quality
  title: Generalizable Machine Learning for Shop-Floor Deployment
  short: Data-efficient and physics-informed ML that generalizes across manufacturing processes, equipment, materials, and operating conditions.
  summary: Machine learning models developed under controlled laboratory conditions often struggle to generalize to real-world manufacturing environments due to domain shifts, limited labeled data, and variations in equipment, materials, and process conditions. We develop generalizable machine learning frameworks that integrate self-supervised representation learning, transfer and continual adaptation, virtual sensing, and manufacturing domain knowledge to enable reliable process monitoring and quality prediction. Our research emphasizes data efficiency, physical consistency, and practical deployment, with applications spanning resistance spot welding, laser welding, and other advanced manufacturing processes.
  media: weld-specimen
  funding: NSF CAREER CMMI-2533634, General Motors
  projects:
  - title: Learning from Unlabeled Manufacturing Data
    text: Develop self-supervised learning methods to extract transferable process representations from unlabeled manufacturing data.
    papers:
    - title: 'Unleashing the power of unlabeled plant data: A hierarchical contrastive learning framework for dynamic manufacturing process monitoring'
      venue: Journal of Manufacturing Systems 2025
      url: https://doi.org/10.1016/j.jmsy.2025.10.001
    - title: Harnessing unlabeled plant data and labeled lab data for enhanced quality prediction in laser welding
      venue: Journal of Manufacturing Processes 2025
      url: https://doi.org/10.1016/j.jmapro.2025.12.023
  - title: Transferable Virtual Sensing and Quality Prediction
    text: Infer unmeasured process variables and predict manufacturing quality using available sensor signals and transferable learning models.
    papers:
    - title: Transfer learning-enhanced transformer for virtual process sensing in resistance spot welding
      venue: Manufacturing Letters 2025
      url: https://doi.org/10.1016/j.mfglet.2025.06.199
    - title: Virtual Sensing by Dense Encoder for Process Signals in Resistance Spot Welding
      venue: ISFA 2024
      url: https://doi.org/10.1115/isfa2024-140071
  - title: Physics-Informed and Generalizable Manufacturing Models
    text: Integrate manufacturing physics with foundation-model learning to improve generalization across processes, materials, and equipment.
    papers:
    - title: Applicable and generalizable machine learning for intelligent welding in automotive manufacturing
      venue: Welding in the World 2025
      url: https://doi.org/10.1007/s40194-025-01951-5
- id: sensing
  title: Process Monitoring and Quality Assurance for Advanced Manufacturing Processes
  short: Multimodal sensing and physics-based modeling for process understanding, defect characterization, and quality assurance.
  summary: Advanced manufacturing processes involve complex interactions among thermal, mechanical, and material phenomena, making critical process states and quality characteristics difficult to observe directly. We develop multimodal sensing that integrate imaging, geometric measurements, and nondestructive evaluation with data-driven and physics-based models to characterize process dynamics and material quality. Our research focuses on improving process observability, detecting manufacturing anomalies, reconstructing internal defects, and understanding the relationships between processing conditions and final part quality, with particular emphasis on welding, directed energy deposition, and hybrid additive–subtractive manufacturing.
  media: ded
  video: true
  funding: NSF HAMMER Engineering Research Center
  projects:
  - title: Multimodal In-Process Monitoring 
    text: Combine imaging and process signals to characterize melt-pool behavior, geometric evolution, and process instabilities.
  - title: Ultrasonic Imaging and Internal Defect Characterization
    text: Develop efficient, generalizable ultrasonic imaging methods for high-resolution reconstruction and characterization of internal defects.
    papers:
    - title: Conditional Normalizing Flows for High-Resolution and Efficient Ultrasound Image Reconstruction
      venue: IEEE Sensors Journal 2026
      url: https://doi.org/10.1109/jsen.2026.3702503
  - title: Process Characterization in Hybrid Additive–Subtractive Manufacturing
    text: Integrate in-situ sensing and thermo-mechanical modeling to investigate geometric accuracy, residual stress, and deposition–milling interactions.
    papers:
    - title: Residual Stress Formation and Redistribution in Hybrid DED-Milling Processes: A Numerical Study
      venue: International Symposium on Flexible Automation 2026
