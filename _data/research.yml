- id: quality
  title: Generalizable machine learning for welding and quality prediction
  short: Models that carry from the lab to the plant, built with General Motors.
  summary: Models developed in the lab rarely survive the plant floor. Through work with General Motors on resistance spot and laser welding, we learn from massive quantities of unlabeled production data, estimate signals the plant has no resources to measure, and are developing a physics-informed foundation model for welding.
  media: weld-specimen
  funding: NSF CAREER CMMI-2533634, General Motors
  projects:
  - title: Learning from unlabeled plant data
    text: Multi-level contrastive and masked pretraining on production welding signals, then fine-tuning with a small set of labels.
    papers:
    - title: 'Unleashing the power of unlabeled plant data: A hierarchical contrastive learning framework for dynamic manufacturing process monitoring'
      venue: Journal of Manufacturing Systems 2025
      url: https://doi.org/10.1016/j.jmsy.2025.10.001
    - title: Harnessing unlabeled plant data and labeled lab data for enhanced quality prediction in laser welding
      venue: Journal of Manufacturing Processes 2025
      url: https://doi.org/10.1016/j.jmapro.2025.12.023
  - title: Virtual sensing in resistance spot welding
    text: Transformer models that generate force and displacement signals from dynamic resistance alone, so quality can be predicted on lines without those sensors.
    papers:
    - title: Transfer learning-enhanced transformer for virtual process sensing in resistance spot welding
      venue: Manufacturing Letters 2025
      url: https://doi.org/10.1016/j.mfglet.2025.06.199
    - title: Virtual Sensing by Dense Encoder for Process Signals in Resistance Spot Welding
      venue: ISFA 2024
      url: https://doi.org/10.1115/isfa2024-140071
  - title: Welding foundation model
    text: A shared, physics-aware representation that transfers across machines, materials, and weld types with minimal recalibration.
    papers:
    - title: Applicable and generalizable machine learning for intelligent welding in automotive manufacturing
      venue: Welding in the World 2025
      url: https://doi.org/10.1007/s40194-025-01951-5
- id: sensing
  title: Sensing and imaging for process monitoring
  short: Ultrasonic defect imaging and wire-laser deposition monitoring.
  summary: 'Physical sensing is combined with learned models to understand what is happening inside a process: including internal defect reconstruction from ultrasonic data, and geometry and residual stress characterization in hybrid wire-laser deposition and milling.'
  media: ded
  video: true
  funding: NSF HAMMER Engineering Research Center
  projects:
  - title: Generalizable ultrasonic imaging
    text: Conditional normalizing flows that reconstruct defect images from raw ultrasonic signals in under 0.03 seconds and generalize to unseen materials and probes.
    papers:
    - title: Conditional Normalizing Flows for High-Resolution and Efficient Ultrasound Image Reconstruction
      venue: IEEE Sensors Journal 2026
      url: https://doi.org/10.1109/jsen.2026.3702503
  - title: Wire-laser directed energy deposition
    text: 3D scanning of bead, layer, and part geometry to correct dripping, wire stubbing, and accumulated height error, plus thermal-mechanical models of residual stress across deposition and milling.
